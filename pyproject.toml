[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luxai-s2s-magpie"
version = "0.1.0"
description = "LuxAI MAGPIE-native speech-to-speech runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LuxAI S.A." }]
keywords = ["speech-to-speech", "magpie", "robotics", "voice-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "luxai-magpie[discovery]>=0.9.6",
    "paramify>=0.2.0",
]

[project.optional-dependencies]
# The protocol/configuration module stays lightweight for robot clients. The
# server installs this extra to obtain the S2S model pipeline and backends.
runtime = [
    "huggingface-hub>=0.34.0",
    "httpx>=0.28.0",
    "nltk==3.10.0",
    "numpy>=1.26.0",
    "openai==2.28.0",
    "onnxruntime>=1.17.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
    "requests>=2.31.0",
    "rich>=13.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.57.0",
    "nano-parakeet>=0.2.0; platform_system != 'Darwin'",
    "faster-qwen3-tts>=0.3.2; platform_system == 'Linux'",
    "faster-qwen3-tts>=0.3.2; platform_system == 'Windows'",
    "librosa==0.11.0",
    "lingua-language-detector>=2.0.2",
]
qwen-ggml = [
    "faster-qwen3-tts[ggml]>=0.3.2; platform_system == 'Linux'",
]
chattts = ["ChatTTS>=0.1.1"]
faster-whisper = ["faster-whisper>=1.0.3"]
kokoro = ["kokoro>=0.9.2; platform_system != 'Darwin'"]
mlx-lm = [
    "mlx-lm==0.31.3; platform_system == 'Darwin'",
    "mlx-vlm==0.4.1; platform_system == 'Darwin'",
]
paraformer = [
    "funasr>=1.1.6",
    "modelscope>=1.17.1",
    "onnxruntime<1.24; python_version < '3.11'",
]
pocket = ["pocket-tts>=0.1.0"]
whisper-mlx = [
    "lightning-whisper-mlx>=0.0.10; platform_system == 'Darwin'",
]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://github.com/luxai-qtrobot/s2s-magpie"
Repository = "https://github.com/luxai-qtrobot/s2s-magpie"
Issues = "https://github.com/luxai-qtrobot/s2s-magpie/issues"

[project.scripts]
luxai-s2s-magpie = "luxai.s2s_magpie.cli:main"
s2s-magpie = "luxai.s2s_magpie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["luxai.s2s_magpie*", "speech_to_speech*"]

[tool.setuptools.package-data]
speech_to_speech = ["TTS/*.wav"]

[tool.setuptools.data-files]
"share/luxai-s2s-magpie/config" = ["config/config.yaml"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
